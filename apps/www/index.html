<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/fav.png" />
    <link rel="stylesheet" href="/src/styles/main.css" />
    <link
      rel="preload"
      href="/fonts/JetBrainsMono-ExtraBold.woff2"
      as="font"
      type="font/woff2"
      crossorigin />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="<!-- theme-color:dark --><!-- /theme-color:dark -->" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="<!-- theme-color:light --><!-- /theme-color:light -->" media="(prefers-color-scheme: light)" />
    <title>goosebumps.fm</title>
    <script>
      (() => {
        let saved = 'system'
        try { saved = localStorage.getItem('vite-ui-theme') || 'system' } catch {}
        const resolved = saved === 'light' || saved === 'dark'
          ? saved
          : matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'
        document.documentElement.classList.add(resolved)
        document.documentElement.dataset.theme = resolved
      })()
    </script>
    <style>
      html[data-theme='dark'] {
        color-scheme: dark;
        background-color: #16415a;
      }
      html[data-theme='light'] {
        color-scheme: light;
        background-color: #e8eef7;
      }
    </style>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/entry.client.ts"></script>
  </body>
</html>
