name: Release

on:
  push:
    branches:
      - prod

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Get Next Version
        id: versioning
        uses: ietf-tools/semver-action@v1
        with:
          token: ${{ github.token }}
          branch: prod

      - name: Update web package.json version
        run: |
          bun pm version ${{ steps.versioning.outputs.next }} --no-git-tag-version
          cd web && bun pm version ${{ steps.versioning.outputs.next }} --no-git-tag-version

      - name: Create Tag
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add .
          git commit -m "chore: bump package version to ${{ steps.versioning.outputs.next }}"
          git tag -a "${{ steps.versioning.outputs.next }}" -m "Release ${{ steps.versioning.outputs.next }}"
          git push origin prod
          git push origin "${{ steps.versioning.outputs.next }}"

      - name: Create Release
        uses: ncipollo/release-action@v1
        with:
          tag: "${{ steps.versioning.outputs.next }}"
          name: "Release ${{ steps.versioning.outputs.next }}"
          body: "Automated release notes"
