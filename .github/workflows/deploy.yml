name: Prod Deployment

on:
  push:
    tags:
      - "v*.*.*"

  workflow_dispatch:
    inputs:
      ref:
        description: 'Git ref (tag, branch, or commit SHA) to deploy'
        required: false
        type: string


concurrency: 
  group: ${{ github.ref }}

jobs:
  deploy:
    runs-on: ubuntu-24.04
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Get latest tag
        id: get-latest-tag
        run: |
          git fetch --tags
          LATEST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "prod")
          echo "latest_tag=$LATEST_TAG" >> $GITHUB_OUTPUT

      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref_name || steps.get-latest-tag.outputs.latest_tag }}
          fetch-depth: 0

      - uses: actions/cache@v4
        with:
            path: |
              ~/.bun/install/cache
            key: ${{ runner.os }}-bun-${{ hashFiles('**/bun.lockb') }}

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'

      - name: Configure Production AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{secrets.AWS_ROLE_ARN}}
          role-duration-seconds: 3600 #adjust as needed for your build time
          aws-region: us-east-1

      - name: deps
        run: bun install

      # - name: typecheck
      #   run: bun typecheck

      - name: Deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_DEFAULT_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_DEFAULT_ACCOUNT_ID }}
          SPOTIFY_CLIENT_ID: ${{ secrets.SPOTIFY_CLIENT_ID }}
          SPOTIFY_CLIENT_SECRET: ${{ secrets.SPOTIFY_CLIENT_SECRET }}
          SQUEAL_DB_URL: ${{ secrets.SQUEAL_DB_URL }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DB_HOST: ${{ secrets.DB_HOST }}
          DB_USER: ${{ secrets.DB_USER }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          DB_PORT: ${{ secrets.DB_PORT }}
          DB_NAME: ${{ secrets.DB_NAME }}

        run: |
          # bun run sst unlock --stage=prod
          # bun run sst refresh --stage=prod
          bun run sst deploy --stage=prod