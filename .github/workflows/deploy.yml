name: Prod Deployment

on:
  push:
    tags:
      - "v*.*.*"

  workflow_dispatch:
    inputs:
      ref:
        description: "Git ref to deploy (leave blank to use latest tag)"
        required: false
        default: ""
        type: string

concurrency:
  group: ${{ github.ref }}

jobs:
  deploy:
    runs-on: ubuntu-24.04
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Initial checkout to determine latest tag
        if: inputs.ref == ''
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get latest tag
        id: get-latest-tag
        if: inputs.ref == ''
        run: |
          LATEST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "prod")
          echo "latest_tag=$LATEST_TAG" >> $GITHUB_OUTPUT
          echo "🏷️Latest tag: $LATEST_TAG"

      - name: Determine deployment ref
        id: deployment-ref
        run: |
          REF="${{ inputs.ref || steps.get-latest-tag.outputs.latest_tag || github.ref }}"
          echo "ref=$REF" >> $GITHUB_OUTPUT
          echo "Deploying ref: $REF"

      - name: Checkout deployment ref
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.deployment-ref.outputs.ref }}
          fetch-depth: 0

      - uses: actions/cache@v4
        with:
          path: |
            ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('**/bun.lock') }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Configure Production AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{secrets.AWS_ROLE_ARN}}
          role-duration-seconds: 3600 #adjust as needed for your build time
          aws-region: us-east-1

      - name: deps
        run: bun install

      # SST Ion manages its own Pulumi binaries. The system-wide ones pre-installed in
      # the GH Actions runner can be outdated and cause "flag provided but not defined: -root" errors.
      - name: Remove system-wide Pulumi
        run: sudo rm -f /usr/local/bin/pulumi*

      - name: Deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_DEFAULT_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_DEFAULT_ACCOUNT_ID }}
          SPOTIFY_CLIENT_ID: ${{ secrets.SPOTIFY_CLIENT_ID }}
          SPOTIFY_CLIENT_SECRET: ${{ secrets.SPOTIFY_CLIENT_SECRET }}
          SQUEAL_DB_URL: ${{ secrets.SQUEAL_DB_URL }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DB_HOST: ${{ secrets.DB_HOST }}
          DB_USER: ${{ secrets.DB_USER }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          DB_PORT: ${{ secrets.DB_PORT }}
          DB_NAME: ${{ secrets.DB_NAME }}
          POSTHOG_KEY: ${{ secrets.POSTHOG_KEY }}
          POSTHOG_HOST: ${{ secrets.POSTHOG_HOST }}
          BETTER_AUTH_URL: ${{ secrets.BETTER_AUTH_URL }}
          BETTER_AUTH_SECRET: ${{ secrets.BETTER_AUTH_SECRET }}
          OTEL_EXPORTER_OTLP_ENDPOINT: ${{ secrets.OTEL_EXPORTER_OTLP_ENDPOINT }}
          GRAFANA_OTLP_TOKEN: ${{ secrets.GRAFANA_OTLP_TOKEN }}

        run: |
          # bun run sst refresh --stage=prod
          bun run sst deploy --stage=prod
