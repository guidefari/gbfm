procs:
  alchemy:
    shell: bun run dev:alchemy
  www:
    shell: bun --filter @gbfm/www dev
    autostart: false
  mobile:
    shell: bun --filter @gbfm/mobile start -- --lan
    autostart: false
  ui:
    shell: bun run ui:playground
    autostart: false
  email:
    shell: bun run email:preview
    autostart: false
  otel:
    shell: bun run otel
    autostart: false
