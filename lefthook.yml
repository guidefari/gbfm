pre-commit:
  parallel: true
  commands:
    format:
      glob: '*.{js,ts,cjs,mjs,d.cts,d.mts,jsx,tsx,json,jsonc,css}'
      run: bun oxfmt --write --no-error-on-unmatched-pattern {staged_files}
      stage_fixed: true

    # lint-staged:
    #   glob: "*.{js,ts,cjs,mjs,d.cts,d.mts,jsx,tsx,json,jsonc,css}"
    #   run: bun oxlint --fix --no-error-on-unmatched-pattern {staged_files}
    #   stage_fixed: true

    theme-css-build:
      glob: 'packages/theme/src/**/*.ts'
      run: cd packages/theme && bun run build:css && git add styles/theme.css
      exclude: 'packages/theme/src/build-css.ts'
